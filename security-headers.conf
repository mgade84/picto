# Included in every location of nginx.conf: a location with its own
# add_header (as the caching rules have) drops headers set at server level.
# `always` adds them to error responses too.
#
# Content Security Policy: exactly what Picto loads and from where. Keep it
# in step with the privacy statement and e2e/privacy.spec.js; a new external
# service needs adding here too, or the browser blocks it.
#   script-src 'self'       only the app's own bundle: no inline scripts, no eval
#   style-src 'unsafe-inline'  MUI/Emotion inject <style> tags at runtime, and
#                           drag-and-drop and the cropper set style attributes
#   img-src                 ARASAAC pictograms, Wikimedia Commons photos,
#                           blob: (own photos) and data: (the inlined logo)
#   connect-src             searches, plus fetching pictures for the PDF
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.arasaac.org https://upload.wikimedia.org https://thumb.wikimedia.org; connect-src 'self' https://api.arasaac.org https://static.arasaac.org https://commons.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
