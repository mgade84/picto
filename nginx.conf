server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Compression. Text files are pre-compressed with maximum gzip at build
    # time (see Dockerfile) and served as-is; anything else compressible is
    # compressed on the fly. Picto is used mostly on phones, often on mobile
    # data: this cuts the app download to about a third.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed build assets: a new build gets new file names, so they can be
    # cached for good.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # The entry point must always be revalidated, so an update reaches users
    # on their next visit instead of an old index.html pointing at old assets.
    # SPA routes are served this file too (via the fallback below), and get
    # the same header.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Icons and other files in public/: fine to cache for a day.
    location ~* \.(?:ico|png|svg|txt)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/security-headers.conf;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
