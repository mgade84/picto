# All tooling runs in containers; nothing is installed on the host.
#
#   docker compose up dev                     # dev server on http://localhost:3000
#   docker compose run --rm dev npm test      # unit tests
#   docker compose run --rm dev npm run lint  # lint
#   docker compose up --build app             # production build on http://localhost:8090
#   docker compose run --rm e2e               # browser tests against the production build

services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "${PICTO_DEV_PORT:-3000}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  app:
    build:
      context: .
      target: prod
    ports:
      - "${PICTO_PORT:-8090}:80"

  e2e:
    # Must match the @playwright/test version pinned in package.json.
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /app
    user: "1000:1000"
    # Share the app container's network, so the browser reaches Picto as
    # http://localhost: a secure context in every browser, like production's
    # HTTPS (needed for the storage estimate, persistent storage, Web Share).
    network_mode: "service:app"
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://localhost
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - app
    command: ["npx", "playwright", "test"]

volumes:
  node_modules:
